name: windows

on:
  push:
    branches:
      - feature/windows-app
      - feature/windows-core
      - feature/windows-toolkit-merge
    paths:
      - "Reimbursement.Windows/**"
      - ".github/workflows/windows.yml"
      - "global.json"
  workflow_dispatch:

jobs:
  core-tests:
    name: Core tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run Core tests
        run: dotnet test Reimbursement.Windows/Core.Tests/Reimbursement.Core.Tests.csproj -c Release

  app-build:
    name: WinUI app build
    # 用 windows-2022（VS2022 工具链）：windows-latest 的 .NET 10 SDK 缺
    # AppxPackage PRI 任务程序集，WinUI 构建会报 MSB4062（已实测）。
    # 另有仓库根目录 global.json 把 SDK 钉在 8.0.x。
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build app (x64, unpackaged)
        run: dotnet build Reimbursement.Windows/App/Reimbursement.App.csproj -c Release -p:Platform=x64
