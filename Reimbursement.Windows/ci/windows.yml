name: windows

on:
  push:
    branches:
      - feature/windows-app
      - feature/windows-core
      - feature/windows-toolkit-merge
      - feature/windows-ux-v2
    tags:
      - "windows-v*"
    paths:
      - "Reimbursement.Windows/**"
      - ".github/workflows/windows.yml"
      - "global.json"
  workflow_dispatch:

jobs:
  core-tests:
    name: Core tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run Core tests
        run: dotnet test Reimbursement.Windows/Core.Tests/Reimbursement.Core.Tests.csproj -c Release

  app-build:
    name: WinUI app build
    # 必须用 VS2022 的 msbuild 构建：WinUI 的 PRI 任务程序集
    # （Microsoft.Build.Packaging.Pri.Tasks.dll）只随 Visual Studio 提供，
    # 独立 .NET SDK 里没有，dotnet build 必然在 MrtCore.PriGen.targets 报
    # MSB4062（SDK 8/10、windows-2022/latest 均已实测）。msbuild 的
    # MSBuildExtensionsPath 指向 VS 安装目录，路径才能解析。
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: microsoft/setup-msbuild@v2
      # 注意：不要用 -t:Publish 出包——publish 会漏掉应用的 PRI 文件
      # （Reimbursement.App.pri，XAML 界面就装在里面），产物启动即闪退（已实测）。
      # 非打包自包含应用直接分发 build 输出目录（与 VS F5 运行的是同一份）。
      - name: Build app (x64, unpackaged self-contained, via VS MSBuild)
        run: msbuild Reimbursement.Windows/App/Reimbursement.App.csproj -restore -p:Configuration=Release -p:Platform=x64
      # 产物门禁：#9 曾因漏 PRI 静默闪退、84MB 的 PDB 白占体积——
      # 上传前先验关键文件齐全，再剔除 PDB，缺一即红，不许残缺产物出厂。
      - name: Verify artifact contents and strip PDBs
        shell: pwsh
        run: |
          $dir = "Reimbursement.Windows/App/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64"
          $required = @(
            "Reimbursement.App.exe",
            "Reimbursement.App.pri",
            "Reimbursement.Core.dll",
            "Reimbursement.Ocr.dll"
          )
          foreach ($f in $required) {
            if (-not (Test-Path (Join-Path $dir $f))) { throw "产物缺失关键文件: $f" }
          }
          $pdfium = Get-ChildItem -Path $dir -Recurse -Filter "pdfium.dll" | Select-Object -First 1
          if (-not $pdfium) { throw "产物缺失关键文件: pdfium.dll" }
          $paddle = Get-ChildItem -Path $dir -Recurse -Filter "paddle_inference_c.dll" | Select-Object -First 1
          if (-not $paddle) { throw "产物缺失关键文件: paddle_inference_c.dll" }
          $pdbCount = (Get-ChildItem -Path $dir -Recurse -Filter "*.pdb").Count
          Get-ChildItem -Path $dir -Recurse -Filter "*.pdb" | Remove-Item -Force
          # OpenCV 的视频组件（ffmpeg）OCR 用不到，单个 28MB，剔除。
          $ffmpeg = Get-ChildItem -Path $dir -Recurse -Filter "opencv_videoio_ffmpeg*.dll"
          $ffmpeg | Remove-Item -Force
          Write-Host "产物门禁通过；已剔除 $pdbCount 个 PDB、$($ffmpeg.Count) 个视频组件"
      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Reimbursement-Windows-x64-selfcontained
          path: Reimbursement.Windows/App/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64/
          if-no-files-found: error
      # 打 windows-v* 标签时把同一份产物压成 zip 发 GitHub Release（永久下载链接，
      # 不必再进 Actions 慢下 artifact）。版本号与 App csproj 的 <Version> 保持一致。
      - name: Publish GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        run: |
          $dir = "Reimbursement.Windows/App/bin/x64/Release/net8.0-windows10.0.19041.0/win-x64"
          $zip = "Reimbursement-Windows-${{ github.ref_name }}.zip"
          Compress-Archive -Path "$dir/*" -DestinationPath $zip
          Write-Host "release zip: $zip"
      - name: Attach zip to release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        uses: softprops/action-gh-release@v2
        with:
          files: Reimbursement-Windows-*.zip
          generate_release_notes: true
