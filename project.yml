name: ReimbursementNative
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: "NO"
    PRODUCT_NAME: 报销整理

targets:
  ReimbursementNative:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
        excludes:
          - "Info.plist"
          - "ReimbursementNative.entitlements"

      # AppIcon.icns → Contents/Resources
      - path: BuildAssets/AppIcon.icns
        buildPhase:
          copyFiles:
            destination: resources

    settings:
      base:
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: Sources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.local.reimbursement
        CODE_SIGN_ENTITLEMENTS: Sources/ReimbursementNative.entitlements
        COMBINE_HIDPI_IMAGES: "YES"
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          ENABLE_TESTABILITY: "YES"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
          ENABLE_TESTABILITY: "NO"
          SWIFT_COMPILATION_MODE: "wholemodule"
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: AppKit.framework
      - sdk: WebKit.framework          # M9 报销系统填报会用
      - sdk: PDFKit.framework           # M3 OCR 用
      - sdk: Vision.framework           # M3 OCR 用
      - sdk: UniformTypeIdentifiers.framework

  ReimbursementNativeTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Tests
    dependencies:
      - target: ReimbursementNative
    settings:
      base:
        PRODUCT_NAME: ReimbursementNativeTests
        PRODUCT_BUNDLE_IDENTIFIER: com.local.reimbursement.tests
        GENERATE_INFOPLIST_FILE: "YES"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/报销整理.app/Contents/MacOS/报销整理"
